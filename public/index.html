<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexYield - Investissement & Gains</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .balance-card {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        /* Panneau Admin masqué par défaut */
        #admin-panel {
            display: none;
            background: #ffeeba;
            border: 1px solid #ffeeba;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .referral-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>NexYield Plateforme</h2>
        
        <!-- Solde Actuel -->
        <div class="balance-card">
            SOLDE ACTUEL (Bonus + Gains)<br>
            <span id="solde-montant">800</span> FCFA
        </div>

        <!-- Bouton de Simulation des gains -->
        <button class="btn" onclick="simulerGains24h()">Simuler les gains de 24h (Paliers)</button>

        <!-- Section Parrainage -->
        <div class="referral-box">
            <h3>Parrainage & Affiliation</h3>
            <p>Partagez votre lien : gagnez <strong>17%</strong> sur le premier dépôt de vos filleuls !</p>
            <button class="btn" style="background-color: #28a745;" onclick="copierLienParrainage()">Copier mon lien de parrainage</button>
        </div>

        <!-- Panneau Administrateur Protégé -->
        <div id="admin-panel">
            <h3>Panneau Administrateur</h3>
            <p>Accès autorisé uniquement par mot de passe.</p>
            <button class="btn" style="background-color: #dc3545;" onclick="fermerAdmin()">Fermer le panneau</button>
        </div>
    </div>

    <script>
        // --- 1. GESTION DU SOLDE ET DE LA SIMULATION ---
        let soldeActuel = 800;

        function mettreAJourAffichageSolde() {
            document.getElementById('solde-montant').innerText = soldeActuel;
        }

        function simulerGains24h() {
            let gainsAjoutes = 500; // Montant simulé ajouté
            soldeActuel += gainsAjoutes;
            mettreAJourAffichageSolde();
            alert("Gains journaliers calculés et distribués avec succès ! +" + gainsAjoutes + " FCFA");
        }

        // --- 2. GESTION DU PARRAINAGE (17% sur le 1er dépôt) ---
        // Simuler un ID utilisateur unique (ex: généré ou récupéré du compte)
        if (!localStorage.getItem('userId')) {
            localStorage.setItem('userId', 'USER_' + Math.floor(Math.random() * 10000));
        }

        function copierLienParrainage() {
            const userId = localStorage.getItem('userId');
            const lienComplet = window.location.origin + window.location.pathname + '?ref=' + userId;
            
            navigator.clipboard.writeText(lienComplet).then(() => {
                alert("Lien de parrainage copié !\nPartagez-le pour toucher 17% sur le premier dépôt de vos filleuls.");
            }).catch(() => {
                prompt("Copiez votre lien manuellement :", lienComplet);
            });
        }

        // Détecter l'arrivée d'un filleul via un lien de parrainage au chargement de la page
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codeParrain = urlParams.get('ref');

            if (codeParrain) {
                localStorage.setItem('filleulParrainId', codeParrain);
                console.log("Visiteur parrainé par : " + codeParrain);
            }
        });

        // Fonction à appeler lors de la validation du PREMIER dépôt du filleul
        function validerPremierDepotFilleul(montantDepose) {
            const parrainId = localStorage.getItem('filleulParrainId');
            const dejaParraine = localStorage.getItem('dejaParraine');

            if (parrainId && !dejaParraine) {
                const commission = montantDepose * 0.17; // 17% du premier dépôt
                console.log(`Le parrain ${parrainId} reçoit une commission de ${commission} FCFA (17% de ${montantDepose})`);
                
                // Marquer que le premier dépôt a déjà généré le bonus
                localStorage.setItem('dejaParraine', 'true');
            }
        }

        // --- 3. ACCÈS ADMINISTRATEUR SÉCURISÉ (Pas de 5 clics publics) ---
        function ouvrirAdminSecret(motDe PasseSaisi) {
            const mdpAdmin = "Bagassi2006"; // Remplacez par votre mot de passe secret
            let mdp = prompt("Entrez le mot de passe administrateur :");
            
            if (mdp === mdpAdmin) {
                document.getElementById('admin-panel').style.display = 'block';
                alert("Accès administrateur autorisé.");
            } else if (mdp !== null) {
                alert("Mot de passe incorrect.");
            }
        }

        function fermerAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        // Pour ouvrir le panneau admin en tant qu'administrateur, 
        // vous pouvez taper ouvrirAdminSecret() directement dans la console de votre navigateur (F12).
    </script>
</body>
</html>
